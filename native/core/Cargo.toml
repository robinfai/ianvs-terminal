[package]
name = "flutterm_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
parking_lot = "0.12"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0"
vt100 = "0.16.2"

[dev-dependencies]
cbindgen = "0.29.2"
tempfile = "3.23.0"
