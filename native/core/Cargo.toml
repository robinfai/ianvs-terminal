[package]
name = "ianvs_core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
regenerate-proto = ["prost-build"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
glob = "0.3"
getrandom = "0.3"
libc = "0.2"
parking_lot = "0.12"
portable-pty = "0.9.0"
par-term-emu-core-rust = { path = "../vendor/par-term-emu-core-rust", default-features = false, features = ["rust-only"] }
prost = "0.14.3"
regex = "1.12.3"
russh = "0.62.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
strip-ansi-escapes = "0.2.1"
tempfile = "3.23.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
zmodem2 = { path = "../vendor/zmodem2", version = "=0.7.2" }

[dev-dependencies]
cbindgen = "0.29.2"

[build-dependencies.prost-build]
version = "0.14.3"
optional = true
