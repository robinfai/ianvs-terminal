name: ianvs_terminal
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace

dependencies:
  crypto: ^3.0.7
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  ianvs_pty:
    path: ../ianvs_pty
  protobuf: ^6.0.0

dev_dependencies:
  analyzer: ^10.0.1
  flutter_test:
    sdk: flutter

# BEGIN terminal font assets (mirrored by tools/sync_terminal_core.dart)
flutter:
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/JETBRAINS-OFL.txt
    - assets/fonts/NERD-FONTS-LICENSE.txt
    - assets/fonts/SOURCES.md
  fonts:
    - family: JetBrainsMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-BoldItalic.ttf
          weight: 700
          style: italic
# END terminal font assets
