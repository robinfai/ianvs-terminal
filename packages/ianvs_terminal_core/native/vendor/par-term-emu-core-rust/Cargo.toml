[package]
edition = "2021"
rust-version = "1.88"
name = "par-term-emu-core-rust"
version = "0.41.1"
authors = ["Paul Robello <probello@gmail.com>"]
build = "build.rs"
exclude = [
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.svg",
    "*.sixel",
    "*.html",
    "*.yaml",
    "images/",
    "examples/",
    "tests/",
    "web-terminal-frontend/",
    "terminfo/",
    "shell_integration/",
    ".github/",
    ".gitignore",
    "CLAUDE.md",
    "handoff.md",
    "streaming.md",
    "Makefile",
    "pyproject.toml",
    "python/",
    "scripts/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Comprehensive terminal emulator library in Rust with Python bindings - VT100/VT220/VT320/VT420/VT520 support, PTY, Sixel/iTerm2/Kitty graphics"
homepage = "https://github.com/paulrobello/par-term-emu-core-rust"
documentation = "https://github.com/paulrobello/par-term-emu-core-rust/blob/main/README.md"
readme = "README.md"
keywords = [
    "terminal",
    "emulator",
    "vt100",
    "pty",
    "sixel",
]
categories = [
    "command-line-utilities",
    "development-tools",
    "api-bindings",
]
license = "MIT"
repository = "https://github.com/paulrobello/par-term-emu-core-rust"

[features]
default = ["rust-only"]
full = [
    "python",
    "streaming",
]
jemalloc = ["tikv-jemallocator"]
python = [
    "pyo3",
    "pyo3/extension-module",
]
regenerate-proto = ["prost-build"]
rust-only = []
streaming = [
    "tokio",
    "tokio-tungstenite",
    "axum",
    "tower-http",
    "futures-util",
    "clap",
    "anyhow",
    "tracing",
    "tracing-subscriber",
    "reqwest",
    "tar",
    "prost",
    "rustls",
    "tokio-rustls",
    "rustls-pemfile",
    "axum-server",
    "htpasswd-verify",
    "headers",
    "sysinfo",
]

[lib]
name = "par_term_emu_core_rust"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "par-term-streamer"
path = "src/bin/streaming_server.rs"
required-features = ["streaming"]

