name: ianvs_terminal_core
description: Embeddable macOS Flutter terminal with a native PTY runtime, viewport, themed bottom panel, and session lifecycle APIs.
version: 0.1.0
repository: https://github.com/robinfai/ianvs-terminal
issue_tracker: https://github.com/robinfai/ianvs-terminal/issues
topics:
  - terminal
  - macos
  - pty
  - emulator
  - flutter

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace

platforms:
  macos:

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  protobuf: ^6.0.0

dev_dependencies:
  analyzer: ^10.0.1
  flutter_test:
    sdk: flutter
  test: ^1.26.0
