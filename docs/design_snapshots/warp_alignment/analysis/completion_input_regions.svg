<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 750;
        paint-order: stroke;
        stroke: #05070a;
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      .small { font-size: 11px; font-weight: 650; }
      .excluded { fill: #94a3b8; fill-opacity: 0.12; stroke: #94a3b8; stroke-width: 2; }
      .pane { fill: none; stroke: #38bdf8; stroke-width: 2; }
      .actualBand { fill: #ef4444; fill-opacity: 0.10; stroke: #ef4444; stroke-width: 3; }
      .actualBody { fill: #f97316; fill-opacity: 0.08; stroke: #fb923c; stroke-width: 2; }
      .actualActions { fill: #a855f7; fill-opacity: 0.14; stroke: #c084fc; stroke-width: 2; }
      .actualDetection { fill: #22d3ee; fill-opacity: 0.11; stroke: #22d3ee; stroke-width: 2; }
      .actualInput { fill: #22c55e; fill-opacity: 0.08; stroke: #22c55e; stroke-width: 2; }
      .expected { fill: none; stroke: #f8fafc; stroke-width: 2; stroke-dasharray: 9 6; }
      .expectedFill { fill: #f8fafc; fill-opacity: 0.035; }
    </style>
  </defs>

  <image href="../completion_input_layout.png" x="0" y="0" width="1440" height="900" />

  <rect class="excluded" x="0" y="0" width="1440" height="106" />
  <text x="12" y="24" fill="#cbd5e1">excluded: Ianvs app/header chrome for pane-local comparison</text>

  <rect class="pane" x="0" y="106" width="1440" height="794" />
  <text x="12" y="128" fill="#38bdf8">Ianvs active pane candidate: origin=(0,106), size=1440x794</text>

  <rect class="expected expectedFill" x="0" y="404" width="1440" height="320" />
  <rect class="expected" x="0" y="404" width="1440" height="320" />
  <text x="12" y="397" fill="#f8fafc">expected from Warp pane-local: full-width block band</text>

  <rect class="actualBand" x="0" y="404" width="1440" height="320" />
  <text x="44" y="370" fill="#fecaca">actual after pane-local pass: full-width block band</text>

  <rect class="expected" x="15" y="436" width="1300" height="257" />
  <text x="22" y="430" fill="#f8fafc">expected command/output body</text>

  <rect class="actualBody" x="15" y="436" width="1300" height="257" />
  <text x="56" y="420" fill="#fed7aa">actual command/output body</text>

  <rect class="expected" x="1310" y="421" width="122" height="46" />
  <text x="1206" y="414" fill="#f8fafc">expected actions</text>

  <rect class="actualActions" x="1310" y="421" width="122" height="46" />
  <text x="1190" y="394" fill="#e9d5ff">actual actions</text>

  <rect class="expected" x="0" y="724" width="1440" height="47" />
  <text x="12" y="746" fill="#f8fafc">expected detection strip</text>

  <rect class="actualDetection" x="0" y="724" width="1440" height="47" />
  <text x="12" y="710" fill="#a5f3fc">actual detection strip</text>

  <rect class="expected" x="0" y="770" width="1440" height="130" />
  <text x="12" y="790" fill="#f8fafc">expected input editor</text>

  <rect class="actualInput" x="0" y="770" width="1440" height="130" />
  <text x="12" y="825" fill="#bbf7d0">actual input editor system</text>

  <text class="small" x="980" y="886" fill="#f8fafc">white dashed = Warp terminal-pane-local projection</text>
</svg>
