<text x="24" y="34" class="title">Add menu entry hierarchy</text>
<text x="24" y="58" class="note">- New tab/window/SSH, saved configs, save current tab/app, and shell selector converge into one plus menu.</text>
<text x="24" y="76" class="note">- Ianvs does not copy Warp agent/cloud entries.</text>
