        </style>
<rect width="1588" height="760" class="bg"/>
<text x="24" y="34" class="title">Launch config success modal</text>
<text x="24" y="58" class="note">- Success state stays open so the saved file can be verified or reapplied.</text>
<text x="24" y="76" class="note">- Ianvs uses Apply saved app, Copy path, and Done instead of Warp-specific file opening copy.</text>
<text x="24.0" y="80.0" class="side-title">Warp reference</text>
