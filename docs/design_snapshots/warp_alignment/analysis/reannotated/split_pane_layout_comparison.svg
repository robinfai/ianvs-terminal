<text x="24" y="34" class="title">Split pane local controls layout</text>
<text x="24" y="58" class="note">- Each pane keeps local header, active marker, context chips, and input editor.</text>
<text x="24" y="76" class="note">- Move-to-tab is covered by behavior tests; drag-to-tab remains a later enhancement.</text>
