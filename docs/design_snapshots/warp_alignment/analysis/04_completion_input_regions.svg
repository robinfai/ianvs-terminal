<svg xmlns="http://www.w3.org/2000/svg" width="3456" height="1078" viewBox="0 0 3456 1078">
  <defs>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 22px;
        font-weight: 700;
        paint-order: stroke;
        stroke: #05070a;
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .small { font-size: 18px; font-weight: 650; }
      .excluded { fill: #94a3b8; fill-opacity: 0.14; stroke: #94a3b8; stroke-width: 3; }
      .pane { fill: none; stroke: #38bdf8; stroke-width: 4; }
      .viewport { fill: #3b82f6; fill-opacity: 0.07; stroke: #60a5fa; stroke-width: 4; }
      .blockBand { fill: #ef4444; fill-opacity: 0.10; stroke: #ef4444; stroke-width: 6; }
      .body { fill: #f97316; fill-opacity: 0.08; stroke: #fb923c; stroke-width: 5; }
      .actions { fill: #a855f7; fill-opacity: 0.14; stroke: #c084fc; stroke-width: 5; }
      .detection { fill: #22d3ee; fill-opacity: 0.11; stroke: #22d3ee; stroke-width: 5; }
      .input { fill: #22c55e; fill-opacity: 0.08; stroke: #22c55e; stroke-width: 5; }
      .chips { fill: #eab308; fill-opacity: 0.11; stroke: #eab308; stroke-width: 4; }
    </style>
  </defs>

  <image href="../warp_interaction/04_completion_input.png" x="0" y="0" width="3456" height="1078" />

  <rect class="excluded" x="0" y="0" width="3456" height="71" />
  <text x="24" y="42" fill="#cbd5e1">excluded: Warp app/tab chrome</text>

  <rect class="excluded" x="0" y="71" width="501" height="1007" />
  <text x="26" y="320" fill="#cbd5e1">excluded</text>
  <text class="small" x="26" y="350" fill="#cbd5e1">Warp sidebar</text>

  <rect class="pane" x="501" y="71" width="2955" height="1007" />
  <text x="540" y="115" fill="#38bdf8">terminal pane coordinate system: origin=(501,71), size=2955x1007</text>

  <rect class="viewport" x="501" y="71" width="2955" height="378" />
  <text x="532" y="165" fill="#93c5fd">empty terminal viewport / terminal title area</text>

  <rect class="blockBand" x="501" y="449" width="2955" height="406" />
  <text x="532" y="480" fill="#fecaca">active block band: full terminal width</text>

  <rect class="body" x="532" y="489" width="2680" height="326" />
  <text x="560" y="525" fill="#fed7aa">command + output body</text>

  <rect class="actions" x="3188" y="470" width="250" height="58" />
  <text x="2826" y="512" fill="#e9d5ff">block actions</text>

  <rect class="detection" x="501" y="855" width="2955" height="59" />
  <text x="532" y="893" fill="#a5f3fc">command detection strip</text>

  <rect class="input" x="501" y="914" width="2955" height="164" />
  <text x="532" y="969" fill="#bbf7d0">input editor system</text>

  <rect class="chips" x="532" y="1010" width="2690" height="45" />
  <text x="950" y="1042" fill="#fef08a">path / git / status chips inside input system</text>
</svg>
