services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ianvs
      MYSQL_USER: ianvs
      MYSQL_PASSWORD: ${IANVS_MYSQL_PASSWORD:?set IANVS_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IANVS_MYSQL_ROOT_PASSWORD:?set IANVS_MYSQL_ROOT_PASSWORD}
    volumes:
      - ianvs-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${IANVS_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ${IANVS_API_CONFIG_FILE:?set IANVS_API_CONFIG_FILE to a 0400 or 0600 JSON configuration}:/run/secrets/ianvs-api-config.json:ro
    ports:
      - "127.0.0.1:47832:47832"

volumes:
  ianvs-mysql:
