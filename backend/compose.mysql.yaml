services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ianvs
      MYSQL_USER: ianvs
      MYSQL_PASSWORD: ${IANVS_MYSQL_PASSWORD:?set IANVS_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IANVS_MYSQL_ROOT_PASSWORD:?set IANVS_MYSQL_ROOT_PASSWORD}
    volumes:
      - ianvs-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${IANVS_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      IANVS_API_MODE: remote
      IANVS_API_ADDR: 0.0.0.0:47832
      IANVS_DB_DRIVER: mysql
      IANVS_DB_DSN: ianvs:${IANVS_MYSQL_PASSWORD}@tcp(mysql:3306)/ianvs?charset=utf8mb4&parseTime=True&loc=UTC
      IANVS_ALLOW_INSECURE_SENSITIVE_TRANSPORT: "true"
    ports:
      - "127.0.0.1:47832:47832"

volumes:
  ianvs-mysql:
