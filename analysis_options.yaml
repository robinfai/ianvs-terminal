include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  exclude:
    - docs/audits/**
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbjson.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 80
  trailing_commas: automate

linter:
  rules:
    # Ianvs is an unpublished application workspace. Requiring API prose for
    # every public test helper, FFI DTO, and widget obscures useful docs.
    public_member_api_docs: false

    # Feature-local relative imports make ownership clearer in this monorepo.
    # Package imports remain required when crossing package boundaries.
    always_use_package_imports: false

    # These rules would require source/API churn without improving correctness.
    always_put_required_named_parameters_first: false
    avoid_equals_and_hash_code_on_mutable_classes: false
    avoid_positional_boolean_parameters: false
    avoid_redundant_argument_values: false
    avoid_setters_without_getters: false
    cascade_invocations: false
    omit_local_variable_types: false
    one_member_abstracts: false
    prefer_constructors_over_static_methods: false
    prefer_foreach: false
    prefer_int_literals: false
    # Dart 3's formatter owns comma insertion through `automate`; a second
    # mandatory-comma policy produces churn without changing formatted output.
    require_trailing_commas: false
    sort_constructors_first: false
    use_setters_to_change_properties: false

    # Protocol fixtures, commands, and user-facing messages legitimately exceed
    # 80 columns; dart format still enforces an 80-column formatting target.
    lines_longer_than_80_chars: false

    # Desktop file access is intentional and is isolated from Flutter's UI loop.
    avoid_slow_async_io: false

    # JSON, FFI, and platform boundaries intentionally normalize SDK Error
    # subtypes into stable transport/domain failures.
    avoid_catching_errors: false

    # Large protocol/action switches retain an explicit fallback so adding a
    # new upstream enum value fails closed instead of silently changing UX.
    no_default_cases: false

    # Split strings keep long diagnostics and golden fixtures readable.
    # Whitespace correctness remains enforced by the dedicated lint.
    no_adjacent_strings_in_list: false

    # Test fakes cannot reuse private super-parameter names across libraries.
    matching_super_parameters: false
