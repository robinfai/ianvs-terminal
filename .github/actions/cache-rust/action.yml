name: Cache Rust dependencies
description: Cargo dependencies only; never cache signed apps or test results.
inputs:
  workspaces:
    description: Cargo workspace paths relative to the repository root
    required: true
runs:
  using: composite
  steps:
    - name: Identify Apple toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        xcode_key="$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
        echo "xcode=$xcode_key" >> "$GITHUB_OUTPUT"
    - name: Restore and save dependency cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: ianvs-ci-v1
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}
        workspaces: ${{ inputs.workspaces }}
        # Retain the action's compiler/manifest/lockfile hashes and per-job isolation.
        add-job-id-key: true
        add-rust-environment-hash-key: true
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST SDKROOT MACOSX_DEPLOYMENT_TARGET IPHONEOS_DEPLOYMENT_TARGET
        cache-bin: false
        cache-workspace-crates: false
        cache-on-failure: true

    # Deliberately limited to the existing Flutter job for this pilot. Other
    # callers keep their previous cache/build behavior. See docs/ci-native-hook-cache.md.
    - name: Validate Native Hook compiler cache
      if: github.job == 'flutter-checks' && vars.IANVS_NATIVE_HOOK_CACHE != 'off'
      shell: bash
      run: python3 -m unittest discover -s tools/ci -p 'test_native_hook_cache.py'

    - name: Install pinned Native Hook compiler cache
      if: github.job == 'flutter-checks' && vars.IANVS_NATIVE_HOOK_CACHE != 'off'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.16.0"

    - name: Configure dependency-only Native Hook cache
      if: github.job == 'flutter-checks' && vars.IANVS_NATIVE_HOOK_CACHE != 'off'
      shell: bash
      run: python3 tools/ci/native_hook_cache.py configure
