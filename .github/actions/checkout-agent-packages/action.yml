name: Check out shared agent packages
description: Resolve the tested ACP source revision at the sibling path used by pubspec.
runs:
  using: composite
  steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        repository: robinfai/ianvs-acp
        ref: 8a0e42f7f70f1127e592546ea1cc444c381210ce
        path: .ci-sources/ianvs-acp
        persist-credentials: false
    - name: Place shared packages beside Terminal
      shell: bash
      run: |
        set -euo pipefail
        destination="$(dirname "$GITHUB_WORKSPACE")/ianvs-acp"
        test ! -e "$destination"
        mv "$GITHUB_WORKSPACE/.ci-sources/ianvs-acp" "$destination"
