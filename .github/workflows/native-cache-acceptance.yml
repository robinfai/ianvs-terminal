name: Native cache acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/native-cache-acceptance.yml'
      - '.github/actions/cache-rust/**'
      - 'tools/ci/native_hook_cache*.py'
      - 'tools/ci/test_native_hook_cache*.py'
      - 'packages/ianvs_pty/hook/**'
      - 'packages/ianvs_terminal_core/hook/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-cache-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The existing cache implementation deliberately admits only this job ID.
  # The check name is distinct; ordinary Verify is still independently required.
  flutter-checks:
    name: Native cache real rebuild acceptance (macos-26)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      IANVS_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Validate acceptance orchestration
        run: python3 -m unittest discover -s tools/ci -p 'test_native_hook_cache_acceptance.py'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.88.0'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false
      - name: Configure the unchanged scoped compiler cache
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            packages/ianvs_terminal_core/native/core
      - name: Prepare locked native dependencies
        timeout-minutes: 10
        run: python3 tools/ci/prepare_example_dependencies.py
      - name: Verify cache-off, source-change and configuration-change rebuilds
        timeout-minutes: 65
        run: python3 tools/ci/native_hook_cache_acceptance.py
      - name: Preserve real rebuild acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cache-real-acceptance
          path: build/ci/cache-acceptance/
          retention-days: 7
