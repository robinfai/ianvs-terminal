name: Verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      render_baseline_candidates:
        description: Generate review candidates after a failed visual comparison
        type: boolean
        default: false
  schedule:
    # Full regression at 02:23 Singapore time; avoid the top-of-hour queue.
    - cron: "23 18 * * *"
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh-openssh:
    name: Rust SSH authentication, jumps, and forwarding
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Verify auth, two-hop jumps, ports, agent, and X11
        run: ./tools/ssh_e2e/run.sh

  zmodem-openssh:
    name: ZMODEM OpenSSH round trip (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Build fixture and verify two-file batches in both directions
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/ianvs-zmodem-e2e.XXXXXX")"
          fixture_name="ianvs-zmodem-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$fixture_name" >/dev/null 2>&1 || true
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT

          docker build --provenance=false \
            --build-arg SOURCE_DATE_EPOCH=1785542400 \
            -t ianvs-zmodem-e2e tools/zmodem_e2e
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/id_ed25519"
          docker run -d --name "$fixture_name" \
            -p 127.0.0.1::22 ianvs-zmodem-e2e
          docker cp "$fixture_dir/id_ed25519.pub" \
            "$fixture_name:/root/.ssh/authorized_keys"
          docker exec "$fixture_name" sh -c \
            'chown root:root /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys'
          fixture_port="$(docker port "$fixture_name" 22/tcp | sed 's/.*://')"

          send_file="$RUNNER_TEMP/ianvs-zmodem-send.bin"
          dd if=/dev/urandom of="$send_file" bs=1048576 count=8 status=none
          touch -d @1700000456 "$send_file"

          test_name=zmodem_round_trips_files_over_real_openssh_pty
          test_list="$(cargo test --manifest-path native/core/Cargo.toml \
            --test zmodem_ssh_test -- --ignored --list)"
          if ! grep -Fqx -- "$test_name: test" <<<"$test_list"; then
            echo "required ignored test is missing: $test_name" >&2
            exit 1
          fi
          IANVS_ZMODEM_SSH_TARGET=root@127.0.0.1 \
          IANVS_ZMODEM_SSH_PORT="$fixture_port" \
          IANVS_ZMODEM_SSH_IDENTITY="$fixture_dir/id_ed25519" \
          IANVS_ZMODEM_SSH_SEND_FILE="$send_file" \
            cargo test --manifest-path native/core/Cargo.toml \
              --test zmodem_ssh_test -- \
              --ignored --exact "$test_name" --nocapture

  zmodem-unsupported-platform:
    name: ZMODEM fail closed (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Verify unsupported-platform capability and request contract
        shell: bash
        run: |
          set -euo pipefail
          test_name=unsupported_platform_zmodem_contract_is_fail_closed
          test_list="$(cargo test --manifest-path native/core/Cargo.toml \
            --test runtime_session_request_test -- --list)"
          if ! grep -Fqx -- "$test_name: test" <<<"$test_list"; then
            echo "required Windows fail-closed test is missing: $test_name" >&2
            exit 1
          fi
          cargo test --manifest-path native/core/Cargo.toml \
            --test runtime_session_request_test \
            "$test_name" -- --exact

  backend-mysql-contract:
    name: Go API and store contracts (MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ianvs-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pianvs-ci-root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Verify MySQL contracts under the race detector
        working-directory: backend
        env:
          IANVS_TEST_DATABASE_DRIVER: mysql
          IANVS_TEST_MYSQL_ADMIN_DSN: root:ianvs-ci-root@tcp(127.0.0.1:3306)/?parseTime=true
        run: |
          go version
          go test -race -p 1 ./...

  flutter-checks:
    name: Dart and Flutter checks (macos-26)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERIFY_FLUTTER_TERMINAL_SKIP_MACOS_INTEGRATION: "1"
      VERIFY_FLUTTER_TERMINAL_SUITE: flutter
      VERIFY_FLUTTER_TERMINAL_EXAMPLE_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
          targets: thumbv7em-none-eabihf

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Match the SDK/engine used by example/test/design/goldens.
          flutter-version: "3.44.2"
          channel: stable
          # flutter-action's cache=true path currently invokes a transitive
          # mutable actions/cache tag. Keep it disabled until upstream pins
          # that dependency; pub/cargo locks still make resolution repeatable.
          cache: false

      - name: Enable macOS build targets
        if: runner.os == 'macOS'
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          flutter config --enable-macos-desktop

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            packages/ianvs_terminal_core/native/core

      - name: Print tool versions
        run: |
          rustc --version
          cargo --version
          flutter --version
          dart --version
          flutter --version --machine
          sw_vers
          uname -m
          shasum -a 256 \
            "$FLUTTER_ROOT"/bin/cache/artifacts/material_fonts/Roboto-*.ttf \
            example/test/design/fonts/NotoSansSC-Regular.otf \
            native/vendor/par-term-emu-core-rust/src/screenshot/JetBrainsMono-Regular.ttf \
            "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"

      - name: Resolve workspace dependencies
        id: dependencies
        run: flutter pub get

      - name: Verify visual baselines
        id: visual_baselines
        working-directory: example
        run: flutter test test/design

      - name: Upload visual comparison failures
        if: failure() && steps.visual_baselines.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-comparison-failures
          path: example/test/design/failures/
          retention-days: 7

      - name: Verify standalone pub archive
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart run tools/verify_terminal_core_publish.dart

      - name: Run repository verification
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          VERIFY_FLUTTER_TERMINAL_SKIP_DESIGN_TESTS: ${{ (steps.visual_baselines.outcome == 'success' || steps.visual_baselines.outcome == 'failure') && '1' || '0' }}
        run: ./tools/verify_flutter_terminal.sh

      - name: Render baseline candidates for review
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.render_baseline_candidates && steps.visual_baselines.outcome == 'failure' }}
        working-directory: example
        # The failed visual comparison remains the gate. These candidate
        # images are only review artifacts and are never committed by CI.
        run: flutter test test/design --update-goldens

      - name: Upload baseline candidates
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.render_baseline_candidates && steps.visual_baselines.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baseline-candidates-macos-26
          path: example/test/design/goldens/macos-26/
          retention-days: 7

  example-checks:
    name: Example widget tests (macos-26, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERIFY_FLUTTER_TERMINAL_SUITE: flutter
      VERIFY_FLUTTER_TERMINAL_EXAMPLE_MODE: only
      VERIFY_FLUTTER_TERMINAL_EXAMPLE_SHARD: ${{ matrix.shard }}
      VERIFY_FLUTTER_TERMINAL_SKIP_DESIGN_TESTS: "1"
      VERIFY_FLUTTER_TERMINAL_SKIP_MACOS_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
          targets: thumbv7em-none-eabihf

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Match the SDK/engine used by example/test/design/goldens.
          flutter-version: "3.44.2"
          channel: stable
          # flutter-action's cache=true path currently invokes a transitive
          # mutable actions/cache tag. Keep it disabled until upstream pins
          # that dependency; pub/cargo locks still make resolution repeatable.
          cache: false

      - name: Enable macOS build targets
        if: runner.os == 'macOS'
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          flutter config --enable-macos-desktop

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            packages/ianvs_terminal_core/native/core

      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Run Example widget tests
        run: ./tools/verify_flutter_terminal.sh

  native-checks:
    name: Rust and Go checks (macos-26)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERIFY_FLUTTER_TERMINAL_SUITE: native
      VERIFY_FLUTTER_TERMINAL_SKIP_MACOS_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate CI policy
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
          targets: thumbv7em-none-eabihf,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            native/completion_core
            native/vendor/par-term-emu-core-rust
            native/vendor/zmodem2
            packages/ianvs_terminal_core/native/core
      - name: Run native repository verification
        run: ./tools/verify_flutter_terminal.sh

  flutter-terminal:
    # Preserve the existing branch-protection check, not just the workflow name.
    name: Flutter terminal (macos-26)
    needs: [native-checks, flutter-checks, example-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every repository suite to pass
        env:
          NATIVE_RESULT: ${{ needs.native-checks.result }}
          FLUTTER_RESULT: ${{ needs.flutter-checks.result }}
          EXAMPLE_RESULT: ${{ needs.example-checks.result }}
        run: |
          printf 'Native: %s; Flutter: %s\n' "$NATIVE_RESULT" "$FLUTTER_RESULT"
          test "$NATIVE_RESULT" = success
          test "$FLUTTER_RESULT" = success
          test "$EXAMPLE_RESULT" = success

  macos-app:
    name: macOS app integration and release (macos-26)
    runs-on: macos-26
    timeout-minutes: 60

    # Start app integration immediately, independently of the repository suite.
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate CI policy
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Select Apple verification scope
        id: scope
        run: python3 tools/ci/apple_verification_scope.py --platform macos

      - name: Set up Go
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Flutter
        if: steps.scope.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: false

      - name: Enable macOS build target
        if: steps.scope.outputs.run == 'true'
        run: flutter config --enable-macos-desktop

      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            packages/ianvs_terminal_core/native/core

      - name: Print tool versions
        if: steps.scope.outputs.run == 'true'
        run: |
          go version
          rustc --version
          cargo --version
          flutter --version
          xcodebuild -version
          sw_vers
          uname -m

      - name: Verify macOS integration, packaging, signature and native tests
        if: steps.scope.outputs.run == 'true'
        env:
          VERIFY_APPLE_FULL: ${{ steps.scope.outputs.full }}
        run: ./tools/verify_macos_app.sh

      - name: Preserve macOS native test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-test-results
          path: build/macos-native-results/
          retention-days: 7

  ios-terminal:
    name: iOS simulator and device (macos-26)
    runs-on: macos-26
    timeout-minutes: 60

    # Run independently so iOS builds do not share the time budget of the
    # macOS/Rust/package suite, without dropping any platform checks.
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate CI policy
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Select Apple verification scope
        id: scope
        run: python3 tools/ci/apple_verification_scope.py --platform ios

      - name: Set up Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Set up Flutter
        if: steps.scope.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: false

      - name: Enable iOS build targets
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/cache-rust
        with:
          workspaces: |
            native/core
            packages/ianvs_terminal_core/native/core

      - name: Print tool versions
        if: steps.scope.outputs.run == 'true'
        run: |
          rustc --version
          cargo --version
          flutter --version
          xcodebuild -version
          sw_vers
          uname -m

      - name: Resolve workspace dependencies
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      - name: Verify iOS simulator and device static linkage and sandbox shell
        if: steps.scope.outputs.run == 'true'
        env:
          VERIFY_APPLE_FULL: ${{ steps.scope.outputs.full }}
        run: ./tools/verify_ios_simulator.sh
