name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh-openssh:
    name: Rust SSH authentication, jumps, and forwarding
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Verify auth, two-hop jumps, ports, agent, and X11
        run: ./tools/ssh_e2e/run.sh

  zmodem-openssh:
    name: ZMODEM OpenSSH round trip (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Build fixture and verify two-file batches in both directions
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/ianvs-zmodem-e2e.XXXXXX")"
          fixture_name="ianvs-zmodem-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$fixture_name" >/dev/null 2>&1 || true
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT

          docker build --provenance=false \
            --build-arg SOURCE_DATE_EPOCH=1785542400 \
            -t ianvs-zmodem-e2e tools/zmodem_e2e
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/id_ed25519"
          docker run -d --name "$fixture_name" \
            -p 127.0.0.1::22 ianvs-zmodem-e2e
          docker cp "$fixture_dir/id_ed25519.pub" \
            "$fixture_name:/root/.ssh/authorized_keys"
          docker exec "$fixture_name" sh -c \
            'chown root:root /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys'
          fixture_port="$(docker port "$fixture_name" 22/tcp | sed 's/.*://')"

          send_file="$RUNNER_TEMP/ianvs-zmodem-send.bin"
          dd if=/dev/urandom of="$send_file" bs=1048576 count=8 status=none
          touch -d @1700000456 "$send_file"

          test_name=zmodem_round_trips_files_over_real_openssh_pty
          test_list="$(cargo test --manifest-path native/core/Cargo.toml \
            --test zmodem_ssh_test -- --ignored --list)"
          if ! grep -Fqx -- "$test_name: test" <<<"$test_list"; then
            echo "required ignored test is missing: $test_name" >&2
            exit 1
          fi
          IANVS_ZMODEM_SSH_TARGET=root@127.0.0.1 \
          IANVS_ZMODEM_SSH_PORT="$fixture_port" \
          IANVS_ZMODEM_SSH_IDENTITY="$fixture_dir/id_ed25519" \
          IANVS_ZMODEM_SSH_SEND_FILE="$send_file" \
            cargo test --manifest-path native/core/Cargo.toml \
              --test zmodem_ssh_test -- \
              --ignored --exact "$test_name" --nocapture

  zmodem-unsupported-platform:
    name: ZMODEM fail closed (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"

      - name: Verify unsupported-platform capability and request contract
        shell: bash
        run: |
          set -euo pipefail
          test_name=unsupported_platform_zmodem_contract_is_fail_closed
          test_list="$(cargo test --manifest-path native/core/Cargo.toml \
            --test runtime_session_request_test -- --list)"
          if ! grep -Fqx -- "$test_name: test" <<<"$test_list"; then
            echo "required Windows fail-closed test is missing: $test_name" >&2
            exit 1
          fi
          cargo test --manifest-path native/core/Cargo.toml \
            --test runtime_session_request_test \
            "$test_name" -- --exact

  backend-mysql-contract:
    name: Go API and store contracts (MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ianvs-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pianvs-ci-root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Verify MySQL contracts under the race detector
        working-directory: backend
        env:
          IANVS_TEST_DATABASE_DRIVER: mysql
          IANVS_TEST_MYSQL_ADMIN_DSN: root:ianvs-ci-root@tcp(127.0.0.1:3306)/?parseTime=true
        run: |
          go version
          go test -race -p 1 ./...

  flutter-terminal:
    name: Flutter terminal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            skip_macos_integration: "1"
          - os: macos-latest
            skip_macos_integration: "0"

    env:
      VERIFY_FLUTTER_TERMINAL_SKIP_MACOS_INTEGRATION: ${{ matrix.skip_macos_integration }}

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; Rust version pinned below
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
          targets: thumbv7em-none-eabihf

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          # flutter-action's cache=true path currently invokes a transitive
          # mutable actions/cache tag. Keep it disabled until upstream pins
          # that dependency; pub/cargo locks still make resolution repeatable.
          cache: false

      - name: Enable Apple build targets
        if: runner.os == 'macOS'
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          flutter config --enable-macos-desktop

      - name: Print tool versions
        run: |
          rustc --version
          cargo --version
          flutter --version
          dart --version

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Verify standalone pub archive
        run: dart run tools/verify_terminal_core_publish.dart

      - name: Run repository verification
        run: ./tools/verify_flutter_terminal.sh

      - name: Verify iOS simulator static linkage and sandbox shell
        if: runner.os == 'macOS'
        run: ./tools/verify_ios_simulator.sh
