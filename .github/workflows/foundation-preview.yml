name: Flutter Foundation Preview

on:
  push:
    branches: [feature/cupertino-material-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false
      - name: Resolve locked dependencies
        id: dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          cd example
          flutter gen-l10n
      - name: Check formatting and retain suggested patch
        id: formatting
        run: python3 tools/preview/check_format.py
      - name: Analyze exact committed source
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: analysis
        run: dart analyze --fatal-infos
      - name: Run foundation and migrated-page regression tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: tests
        working-directory: example
        run: |
          flutter test \
            test/ui/app_components_test.dart \
            test/ui/app_choice_tile_test.dart \
            test/ui/app_dropdown_form_field_test.dart \
            test/ui/app_theme_contract_test.dart \
            test/ui/app_motion_test.dart \
            test/ui/app_notifications_test.dart \
            test/ui/configuration_field_semantics_test.dart \
            test/ui/desktop_action_contrast_test.dart \
            test/ui/cupertino_foundation_test.dart \
            test/ssh/mobile_ssh_form_test.dart
      - name: Build real Flutter Web showcase
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: web
        working-directory: example
        run: flutter build web --release --target lib/component_preview.dart --no-web-resources-cdn --base-href /
      - name: Save formatting suggestions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-format-${{ github.sha }}
          path: build/foundation-format.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Record build provenance and validation outcomes
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          FORMAT_OUTCOME: ${{ steps.formatting.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = {key: os.environ[key] for key in ['SOURCE_SHA', 'FORMAT_OUTCOME', 'ANALYSIS_OUTCOME', 'TEST_OUTCOME']}
          result['flutter'] = '3.44.2'
          result['publishable'] = all(result[key] == 'success' for key in ['FORMAT_OUTCOME', 'ANALYSIS_OUTCOME', 'TEST_OUTCOME'])
          pathlib.Path('example/build/web/validation.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Save static build for private preview QA
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-web-${{ github.sha }}
          path: example/build/web/
          if-no-files-found: error
          retention-days: 7
