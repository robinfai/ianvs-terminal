name: macOS Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Test release version (major.minor.patch)'
        type: string
        required: true
        default: '0.1.0'

permissions:
  contents: read

# main only accepts PRs. Serialize publication so the latest feed cannot regress.
concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    # Manual runs publish a prerelease; automatic stable releases remain opt-in.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MACOS_RELEASE_ENABLED == 'true')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
      RELEASE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = (
              'MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD',
              'SPARKLE_PRIVATE_KEY', 'SPARKLE_PUBLIC_KEY', 'MACOS_SIGNING_IDENTITY',
          )
          notary = ('NOTARY_API_KEY_BASE64', 'NOTARY_KEY_ID', 'NOTARY_ISSUER_ID') if os.environ.get('NOTARY_API_KEY_BASE64') else ('APPLE_ID', 'APPLE_TEAM_ID', 'APPLE_APP_SPECIFIC_PASSWORD')
          missing = [name for name in required + notary if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure release secrets/variables before publishing: ' + ', '.join(missing))
          if not os.environ['MACOS_SIGNING_IDENTITY'].startswith('Developer ID Application:'):
              raise SystemExit('Apple Development or ad-hoc signing cannot publish a public release')
          PY

      - name: Select version and reject stale publication
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          build=$(git rev-list --count HEAD)
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            version="$REQUESTED_VERSION"
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo '::error::Version must be major.minor.patch'; exit 1;
            }
            test -f "docs/release/$version.md"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            version="1.1.$build"
            latest_build=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v1\\.1\\.[0-9]+$")) | split(".")[-1] | tonumber] | max // 0' | sort -nr | head -1)
            if (( build <= latest_build )); then
              echo "Release $version already published or superseded."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          # Fail on an API error; reject public releases before expensive builds.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "v$version" <<'PYCODE'
          import json, sys
          text = open(sys.argv[1]).read()
          decoder = json.JSONDecoder()
          while text.strip():
              releases, end = decoder.raw_decode(text.lstrip())
              for release in releases:
                  if release['tag_name'] == sys.argv[2] and not release['draft']:
                      raise SystemExit('Refusing to replace published release ' + sys.argv[2])
              text = text.lstrip()[end:]
          PYCODE
          echo "RELEASE_BUILD=$build" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_OUTPUT=$RUNNER_TEMP/trail-release" >> "$GITHUB_ENV"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Set up Flutter
        if: steps.version.outputs.publish == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: false

      - name: Set up Rust
        if: steps.version.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.90.0'
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Go
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Verify release helpers and prepare Sparkle
        if: steps.version.outputs.publish == 'true'
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          bash tools/release/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          flutter pub get --enforce-lockfile

      - name: Import signing credentials into an ephemeral keychain
        if: steps.version.outputs.publish == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/trail-signing"
          mkdir -p "$signing_dir"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'trail-signing'
          for name, filename in [('MACOS_CERTIFICATE_P12_BASE64', 'certificate.p12'), ('NOTARY_API_KEY_BASE64', 'notary.p8')]:
              if os.environ.get(name):
                  (root / filename).write_bytes(base64.b64decode(os.environ[name], validate=True))
          (root / 'sparkle.key').write_text(os.environ['SPARKLE_PRIVATE_KEY'])
          PY
          keychain="$signing_dir/release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "SPARKLE_KEY_FILE=$signing_dir/sparkle.key" >> "$GITHUB_ENV"
          if [[ -f "$signing_dir/notary.p8" ]]; then
            echo "NOTARY_KEY_FILE=$signing_dir/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize, and sign the update feed
        if: steps.version.outputs.publish == 'true'
        run: bash tools/release/build_macos_release.sh

      - name: Publish complete release atomically
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/existing-release" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/existing-release")" = true
            # A rerun may resume its own draft, but never replace another commit.
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            flags=(--generate-notes)
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              flags=(--prerelease --notes-file "docs/release/$RELEASE_VERSION.md")
            fi
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Trail $RELEASE_VERSION" "${flags[@]}"
          fi
          gh release upload "$tag" "$RELEASE_OUTPUT/Trail-$RELEASE_VERSION-macOS-universal.zip" \
            "$RELEASE_OUTPUT/appcast.xml" "$RELEASE_OUTPUT/SHA256SUMS" --clobber
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi

      - name: Save notarization diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarization-result
          path: ${{ runner.temp }}/trail-release/notarization*.json
          if-no-files-found: ignore

      - name: Remove ephemeral signing material
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/trail-signing"
          if [[ -f "$signing_dir/release.keychain-db" ]]; then
            security delete-keychain "$signing_dir/release.keychain-db"
          fi
          rm -rf -- "$signing_dir"
