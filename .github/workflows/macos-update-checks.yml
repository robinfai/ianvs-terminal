name: macOS Update Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'example/macos/**'
      - 'tools/release/**'
      - '.github/workflows/macos-*.yml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: macos-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-checks:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate release metadata and signing guardrails
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          for script in tools/release/*.sh; do bash -n "$script"; done
          plutil -lint example/macos/Runner/Info.plist example/macos/Runner.xcodeproj/project.pbxproj
          bash tools/release/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          bash tools/release/test_update_signatures.sh "$RUNNER_TEMP/sparkle/bin"
      # Verify / macos-app owns the Sparkle framework assertion and all
      # RunnerTests. Avoid another SDK download, Rust build and Xcode test run.
